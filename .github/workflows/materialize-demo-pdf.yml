name: Materialize Demo PDF

on:
  push:
    branches: [main]
    paths:
      - ".github/pdf-payload/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild PDF from payload chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat .github/pdf-payload/part-* > /tmp/enterprise-flow-demo.b64
          base64 --decode /tmp/enterprise-flow-demo.b64 > docs/EnterpriseFlow_CRM_V1_Demo_Evidence.pdf
          echo "062a76289d10ad55db5d59388141ad8507442b5acd65de5b70cdc93077fb8c64  docs/EnterpriseFlow_CRM_V1_Demo_Evidence.pdf" | sha256sum -c -
          rm -rf .github/pdf-payload

      - name: Commit generated PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EnterpriseFlow_CRM_V1_Demo_Evidence.pdf .github/pdf-payload
          git commit -m "Add EnterpriseFlow CRM V1 demo evidence PDF"
          git push
